<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Year 3 Scratch 3 Exam: The Star Collector</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap');

  :root {
    --card: #ffffff;
    --primary: #4c97ff;
    --accent: #ffab19;
    --success: #0fbd8c;
    --text: #2d3748;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Nunito', sans-serif;
    background: linear-gradient(135deg, #e0f2fe 0%, #fef9c3 50%, #fce7f3 100%);
    color: var(--text);
    padding: 20px;
    min-height: 100vh;
  }

  .container {
    max-width: 820px;
    margin: 0 auto;
  }

  /* Header */
  .header {
    background: linear-gradient(135deg, #4c97ff, #855cd6);
    color: white;
    padding: 20px 26px;
    border-radius: 24px;
    box-shadow: 0 10px 25px rgba(76, 151, 255, 0.25);
    text-align: center;
    margin-bottom: 20px;
  }

  .header h1 {
    font-family: 'Fredoka', sans-serif;
    font-size: 2rem;
    margin: 0 0 6px 0;
  }

  .header p {
    font-size: 1.1rem;
    margin: 0;
    opacity: 0.95;
  }

  /* Stepper Dots */
  .stepper {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .step-pill {
    background: white;
    color: #64748b;
    padding: 8px 16px;
    border-radius: 999px;
    font-family: 'Fredoka', sans-serif;
    font-size: 0.95rem;
    border: 3px solid #e2e8f0;
    transition: all 0.25s;
  }

  .step-pill.active {
    background: #4c97ff;
    color: white;
    border-color: #2563eb;
    transform: scale(1.05);
  }

  .step-pill.completed {
    background: #0fbd8c;
    color: white;
    border-color: #059669;
  }

  /* Screen Panels */
  .screen {
    display: none;
    animation: fadeIn 0.3s ease;
  }

  .screen.active {
    display: block;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Cards */
  .card {
    background: var(--card);
    border-radius: 24px;
    padding: 26px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.07);
    border: 4px solid #fff;
  }

  .card.intro { border-color: #c4b5fd; text-align: center; }
  .card.player { border-color: #93c5fd; }
  .card.star { border-color: #fcd34d; }
  .card.finish { border-color: #6ee7b7; text-align: center; }

  .card-title {
    font-family: 'Fredoka', sans-serif;
    font-size: 1.6rem;
    margin: 0 0 16px 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  /* Checklist Items */
  .task-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    background: #f8fafc;
    padding: 13px 16px;
    border-radius: 14px;
    margin-bottom: 12px;
    border: 2px solid #e2e8f0;
    cursor: pointer;
    transition: all 0.2s;
  }

  .task-item:hover {
    border-color: #4c97ff;
    background: #f0f9ff;
  }

  .task-item.done {
    background: #ecfdf5;
    border-color: #0fbd8c;
  }

  .task-item.done span {
    text-decoration: line-through;
    color: #047857;
  }

  .task-item input[type="checkbox"] {
    width: 24px;
    height: 24px;
    accent-color: #0fbd8c;
    cursor: pointer;
    margin-top: 2px;
    flex-shrink: 0;
  }

  .task-item span {
    font-size: 1.08rem;
    line-height: 1.4;
    font-weight: 700;
  }

  /* Scratch Block Visuals */
  .blocks-area {
    background: #f1f5f9;
    border: 2px dashed #cbd5e1;
    border-radius: 18px;
    padding: 18px;
    margin-top: 18px;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 0.95rem;
    color: white;
    overflow-x: auto;
  }

  .blocks-label {
    color: #475569;
    font-size: 0.9rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
    display: block;
  }

  .sb {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 12px;
    border-radius: 8px;
    margin: 3px 0;
    box-shadow: 0 2px 0 rgba(0,0,0,0.2);
    white-space: nowrap;
  }

  .sb-hat { border-radius: 18px 18px 8px 8px; padding-top: 10px; }
  .event { background: #ffbf00; color: #fff; text-shadow: 0 1px 1px rgba(0,0,0,0.2); }
  .control { background: #ffab19; }
  .motion { background: #4c97ff; }
  .sensing { background: #5cb1d6; border-radius: 20px; padding: 4px 10px; }
  .operator { background: #59c059; border-radius: 20px; padding: 4px 10px; }
  .sound { background: #cf63cf; }
  .variable { background: #ff8c1a; }

  .input-pill {
    background: white;
    color: #1e293b;
    padding: 2px 8px;
    border-radius: 12px;
    font-weight: 800;
  }

  .dropdown-pill {
    background: rgba(0,0,0,0.18);
    padding: 2px 8px;
    border-radius: 8px;
  }

  .c-block {
    border-left: 14px solid #ffab19;
    padding-left: 10px;
    margin: 4px 0 4px 6px;
  }

  .c-bottom {
    height: 14px;
    width: 140px;
    background: #ffab19;
    border-radius: 0 0 8px 8px;
    margin-bottom: 4px;
  }

  /* Canvas */
  canvas {
    background: linear-gradient(180deg, #1e1b4b 0%, #312e81 100%);
    border-radius: 16px;
    border: 4px solid #8b5cf6;
    max-width: 100%;
    display: block;
    margin: 14px auto;
  }

  /* Buttons & Navigation */
  .nav-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 22px;
    gap: 12px;
  }

  .btn {
    font-family: 'Fredoka', sans-serif;
    font-size: 1.15rem;
    padding: 12px 26px;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    color: white;
    background: #0fbd8c;
    box-shadow: 0 4px 0 #098c67;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: all 0.15s;
  }

  .btn:active:not(:disabled) {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #098c67;
  }

  .btn.next {
    background: #4c97ff;
    box-shadow: 0 4px 0 #2563eb;
